experiment:
  name: road_cl
  output_dir: runs

data:
  data_dir: data/Road Anomalies
  files:
    Normal: normal_road_data_89_82Hz.csv
    Bump: combined_bump.csv
    Pothole: combined_pothole.csv
  fs: 89.82
  time_tol: 1.0e-7
  window: 90
  stride: 45
  noise_std: 0.10
  perturbation_seed: 1007

training:
  steps: 100
  bags_per_step: 12
  windows_per_bag: 8
  kd_bags_per_step: 8
  temperature: 2.0
  gate_power: 1.0
  lr: 0.003
  grad_clip: 5.0

protocol:
  profile: full
  folds: 4
  split_repeats: 1
  seeds: 5
  seed: 42
  threads: 1
  bootstrap_iterations: 1000
  latency_windows: 128
  latency_repeats: 10
  checkpoint: true
